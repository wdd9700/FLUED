[package]
name = "flued-corpus-evacuator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
parquet = { version = "55", features = ["arrow"] }
arrow-array = "55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2.5"
zstd = "0.13"
