[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flued"
version = "0.4.0"
description = "Research implementations for reversible byte-to-latent language interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alethic Insight" }]
dependencies = [
  "numpy>=2.0",
  "tokenizers>=0.20",
  "torch>=2.6",
  "tqdm>=4.66",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["flued*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
